<style>
        body {
            background-color: #0b0e14; /* surface-container-lowest */
            overflow: hidden;
        }
        .grid-pattern {
            background-image: radial-gradient(rgba(114, 255, 112, 0.05) 1px, transparent 1px);
            background-size: 24px 24px;
        }
        .glow-effect {
            box-shadow: 0 0 40px rgba(114, 255, 112, 0.15);
        }
        @keyframes pulse-soft {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.7; }
        }
        .animate-pulse-soft {
            animation: pulse-soft 4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="antialiased text-on-surface">
<!-- Background Pattern -->
<div class="fixed inset-0 grid-pattern pointer-events-none opacity-40"></div>
<!-- Atmospheric Ambient Light -->
<div class="fixed -top-1/4 -left-1/4 w-full h-full bg-primary-fixed/5 blur-[120px] rounded-full pointer-events-none animate-pulse-soft"></div>
<div class="fixed -bottom-1/4 -right-1/4 w-full h-full bg-secondary-container/5 blur-[120px] rounded-full pointer-events-none animate-pulse-soft" style="animation-delay: 2s;"></div>
<main class="relative z-10 flex flex-col items-center justify-between min-h-screen px-margin py-xl">
<!-- Header/Top Status (Implicit) -->
<div class="w-full flex justify-end">
<div class="flex items-center gap-xs text-primary-fixed/60 font-mono-code text-mono-code">
<span class="w-2 h-2 bg-primary-fixed rounded-full animate-pulse"></span>
                v1.0.4-stable
            </div>
</div>
<!-- Center Content: Logo and Tagline -->
<div class="flex flex-col items-center text-center space-y-lg">
<!-- Logo Section -->
<div class="relative group">
<div class="absolute inset-0 bg-primary-fixed/20 blur-xl rounded-full scale-125 transition-transform duration-700 group-hover:scale-150"></div>
<div class="relative w-20 h-20 bg-surface-container border border-outline-variant/30 rounded-xl flex items-center justify-center glow-effect">
<span class="material-symbols-outlined text-primary-fixed !text-[40px]" data-weight="fill">terminal</span>
</div>
</div>
<!-- Identity -->
<div class="space-y-xs">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface tracking-tighter">
                    Trak
                </h1>
<p class="font-body-md text-body-md text-on-surface-variant/80 max-w-[280px]">
                    Trak — track what matters
                </p>
</div>
</div>
<!-- Action / CTA Area -->
<div class="w-full max-w-sm space-y-md">
<!-- Feature Pills (Bento-lite) -->
<div class="grid grid-cols-2 gap-sm mb-lg">
<div class="bg-surface-container/50 border border-outline-variant/20 p-md rounded-lg flex items-center gap-sm">
<span class="material-symbols-outlined text-primary-fixed text-sm">speed</span>
<span class="font-mono-label text-mono-label text-on-surface-variant">Real-time</span>
</div>
<div class="bg-surface-container/50 border border-outline-variant/20 p-md rounded-lg flex items-center gap-sm">
<span class="material-symbols-outlined text-secondary text-sm">security</span>
<span class="font-mono-label text-mono-label text-on-surface-variant">Encrypted</span>
</div>
</div>
<!-- Primary CTA -->
<button class="w-full h-touch-target bg-primary-fixed text-on-primary-fixed font-headline-md text-headline-md rounded-lg flex items-center justify-center gap-sm active:scale-95 transition-all duration-150 hover:bg-primary-container group" id="get-started">
                Get Started
                <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">chevron_right</span>
</button>
<!-- Secondary/Legal -->
<p class="text-center font-body-sm text-body-sm text-on-surface-variant/40 px-lg leading-relaxed">
                By continuing, you agree to our <a class="underline hover:text-on-surface transition-colors" href="#">Terms of Service</a> and <a class="underline hover:text-on-surface transition-colors" href="#">Privacy Policy</a>.
            </p>
</div>
</main>
<!-- Footer Identity Bar -->
<div class="fixed bottom-0 left-0 w-full h-1 bg-surface-container-highest/20 overflow-hidden">
<div class="h-full bg-primary-fixed w-0 transition-all duration-[2000ms] ease-out" id="progress-bar"></div>
</div>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Simulated loading state for visual flair
            const bar = document.getElementById('progress-bar');
            setTimeout(() => {
                bar.style.width = '100%';
            }, 100);

            // Button interaction
            const cta = document.getElementById('get-started');
            cta.addEventListener('click', () => {
                // Flash effect
                cta.style.backgroundColor = '#ffffff';
                setTimeout(() => {
                    cta.style.backgroundColor = '';
                    console.log('Trak: Initiating session...');
                }, 100);
            });

            // Gentle parallax movement for background elements
            document.addEventListener('mousemove', (e) => {
                const moveX = (e.clientX - window.innerWidth / 2) * 0.01;
                const moveY = (e.clientY - window.innerHeight / 2) * 0.01;
                const grid = document.querySelector('.grid-pattern');
                grid.style.transform = `translate(${moveX}px, ${moveY}px)`;
            });
        });
    </script>
</body></html>
