<script>
        // Micro-interactions for form elements
        document.querySelectorAll('input, textarea').forEach(el => {
            el.addEventListener('focus', () => {
                const parent = el.closest('.input-glow');
                if (parent) {
                    parent.classList.add('border-primary-fixed');
                }
            });
            el.addEventListener('blur', () => {
                const parent = el.closest('.input-glow');
                if (parent) {
                    parent.classList.remove('border-primary-fixed');
                }
            });
        });

        // Simple sheet drag "feel" (Visual only)
        const sheet = document.getElementById('projectSheet');
        let startY = 0;
        sheet.addEventListener('touchstart', (e) => {
            startY = e.touches[0].clientY;
        });
        sheet.addEventListener('touchmove', (e) => {
            const currentY = e.touches[0].clientY;
            const diff = currentY - startY;
            if (diff > 0 && sheet.scrollTop <= 0) {
                sheet.style.transform = `translateY(${diff}px)`;
            }
        });
        sheet.addEventListener('touchend', (e) => {
            sheet.style.transform = `translateY(0px)`;
        });
    </script>
